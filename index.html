<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Taxi gesucht – Lernpfad Fruchtverbreitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#DFF3FF;
    --meadow:#EAF8E2;
    --card:#FFFFFF;
    --ink:#233A2A;
    --ink-soft:#5D6E5F;
    --forest:#2FA463;
    --forest-dark:#1F7C49;
    --wind:#2196D6;
    --wind-dark:#136FA6;
    --tier:#F0862B;
    --tier-dark:#C4661A;
    --gold:#FFC93C;
    --gold-dark:#E0A400;
    --berry:#EF4E70;
    --line:#DCEBD8;
    --wind-tint:#EAF6FD;
    --tier-tint:#FDF1E6;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--sky) 0%, var(--meadow) 380px, var(--meadow) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    letter-spacing:0;
    color:var(--forest-dark);
    line-height:1.2;
  }
  .section-wind h1,.section-wind h2,.section-wind .display,.section-wind .accent{color:var(--wind-dark);}
  .section-tier h1,.section-tier h2,.section-tier .display,.section-tier .accent{color:var(--tier-dark);}

  button{font-family:inherit;}
  #app{max-width:940px; margin:0 auto; padding:16px 16px 60px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 4px 16px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.15rem; color:var(--forest-dark);}
  .section-pill{font-size:0.8rem; font-weight:700; padding:6px 14px; border-radius:100px; background:var(--card); border:2px solid var(--line); color:var(--ink-soft);}
  .section-pill.wind{border-color:var(--wind); color:var(--wind-dark); background:var(--wind-tint);}
  .section-pill.tier{border-color:var(--tier); color:var(--tier-dark); background:var(--tier-tint);}

  /* progress trail: growing sprout style */
  .trail{display:flex; gap:3px; margin-bottom:20px; overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch;}
  .trail .stop{flex:0 0 46px; min-width:46px; text-align:center; position:relative; padding-top:4px;}
  .trail .stop .dot{
    width:14px; height:14px; border-radius:50%; background:#fff; border:2.5px solid var(--line);
    margin:0 auto; position:relative; z-index:2; display:flex; align-items:center; justify-content:center; font-size:9px;
  }
  .trail .stop.done .dot{background:var(--forest); border-color:var(--forest); color:#fff;}
  .trail .stop.done .dot::after{content:'✓'; color:#fff; font-size:9px; font-weight:bold;}
  .trail .stop.current .dot{background:var(--gold); border-color:var(--gold-dark); width:18px; height:18px;}
  .trail .stop::before{content:''; position:absolute; top:11px; left:-50%; width:100%; height:3px; background:var(--line); z-index:1; border-radius:2px;}
  .trail .stop:first-child::before{display:none;}
  .trail .stop.done::before{background:var(--forest);}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:28px 26px;
    box-shadow:0 4px 0 rgba(35,58,42,0.06), 0 1px 3px rgba(35,58,42,0.08);
  }
  .section-wind .card{background:linear-gradient(180deg, var(--wind-tint) 0%, #fff 140px);}
  .section-tier .card{background:linear-gradient(180deg, var(--tier-tint) 0%, #fff 140px);}

  .eyebrow{font-size:0.85rem; color:var(--ink-soft); font-weight:800; margin:0 0 4px; text-transform:uppercase; letter-spacing:0.03em;}
  .card h2{font-size:1.55rem; margin:2px 0 14px;}
  .card p{line-height:1.65; font-size:1.02rem;}
  .lede{font-size:1.08rem; line-height:1.7;}

  .divider{border:none; border-top:2px dashed var(--line); margin:22px 0;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--forest); color:#fff; border:none;
    padding:14px 24px; border-radius:100px; font-weight:800; font-size:1rem; cursor:pointer;
    box-shadow:0 3px 0 var(--forest-dark); transition:transform .1s ease;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--forest-dark);}
  .btn:disabled{background:#CBD6CC; box-shadow:0 3px 0 #AFC0B2; cursor:not-allowed;}
  .btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line); box-shadow:none;}
  .section-wind .btn:not(.ghost){background:var(--wind); box-shadow:0 3px 0 var(--wind-dark);}
  .section-tier .btn:not(.ghost){background:var(--tier); box-shadow:0 3px 0 var(--tier-dark);}
  .section-wind .btn:disabled, .section-tier .btn:disabled{background:#CBD6CC !important; box-shadow:0 3px 0 #AFC0B2 !important; cursor:not-allowed;}

  .actions{display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; flex-wrap:wrap;}

  .example-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:18px 0;}
  .example{background:#fff; border:2px solid var(--line); border-radius:14px; padding:14px; text-align:center;}
  .example .imgwrap{height:100px; display:flex; align-items:center; justify-content:center; margin-bottom:8px;}
  .example img{max-height:95px; max-width:100%; border-radius:8px;}
  .example .name{font-weight:800; font-size:0.92rem; margin-bottom:2px;}
  .example .desc{font-size:0.82rem; color:var(--ink-soft); line-height:1.4;}

  .diagram{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff; border:2px solid var(--line); border-radius:16px; padding:18px 12px; margin:18px 0; flex-wrap:wrap;}
  .diagram .step{flex:1 1 0; text-align:center; min-width:90px;}
  .diagram .step .cap{font-size:0.8rem; font-weight:700; margin-top:6px;}
  .diagram .arrow{font-size:1.6rem; color:var(--line); flex:0 0 auto;}

  .explain-box{background:#fff; border:2px solid var(--line); border-radius:14px; padding:18px 20px; margin:16px 0; line-height:1.65;}
  .explain-box h3{font-size:1.05rem; margin:0 0 8px;}
  .explain-box ul{margin:6px 0 0; padding-left:22px;}
  .explain-box li{margin-bottom:6px; line-height:1.5;}

  .vor-nach-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0;}
  @media (max-width:600px){.vor-nach-grid{grid-template-columns:1fr;}}
  .vn-box{border-radius:14px; padding:16px 18px; line-height:1.6;}
  .vn-box.vor{background:#EAF8EA; border:2px solid #BFE6C0;}
  .vn-box.nach{background:#FDECEC; border:2px solid #F3C7C7;}
  .vn-box .vn-title{font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:6px;}

  .merksatz{background:var(--gold); color:#3A2C00; border-radius:14px; padding:14px 18px; margin:16px 0; font-weight:700; line-height:1.5; box-shadow:0 3px 0 var(--gold-dark);}

  .bonus-box{border:2px dashed var(--gold-dark); border-radius:14px; margin:16px 0;}
  .bonus-toggle{width:100%; text-align:left; background:#FFF8E4; border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:0.94rem;}
  .bonus-body{display:none; padding:0 16px 14px; font-size:0.92rem; line-height:1.55;}
  .bonus-box.open .bonus-body{display:block;}

  .write-prompt{background:#FFF8E4; border:2px dashed var(--gold-dark); border-radius:14px; padding:18px 20px; margin:20px 0;}
  .write-prompt .head{display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:8px; color:var(--forest-dark); font-family:'Fredoka',sans-serif; font-size:1.05rem;}
  .section-wind .write-prompt .head{color:var(--wind-dark);}
  .section-tier .write-prompt .head{color:var(--tier-dark);}
  .confirm-row{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:0.98rem; font-weight:700; cursor:pointer;}
  .confirm-row input{width:22px; height:22px; accent-color:var(--forest);}
  .section-wind .confirm-row input{accent-color:var(--wind);}
  .section-tier .confirm-row input{accent-color:var(--tier);}

  table.ref{width:100%; border-collapse:collapse; margin:16px 0; font-size:0.92rem;}
  table.ref th, table.ref td{border:2px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top; line-height:1.55;}
  table.ref th{background:var(--forest); color:#fff; font-family:'Fredoka',sans-serif; font-weight:600;}
  table.ref th.wind-col{background:var(--wind);}
  table.ref th.tier-col{background:var(--tier);}
  table.ref td.pending{color:#b7b7ac; font-style:italic; background:#fafaf5;}

  .stack-list{background:#fff; border:2px solid var(--line); border-radius:14px; padding:6px 18px; margin:14px 0;}
  .stack-list .stack-heading{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.05rem; padding:12px 0 8px; color:var(--forest-dark); border-bottom:2px solid var(--line);}
  .section-wind .stack-list .stack-heading{color:var(--wind-dark);}
  .section-tier .stack-list .stack-heading{color:var(--tier-dark);}
  .stack-row{padding:12px 0; border-bottom:1px dashed var(--line); line-height:1.55;}
  .stack-row:last-child{border-bottom:none;}
  .stack-row .stack-label{display:block; font-weight:800; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:3px;}

  .quiz-item{border:2px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px; background:#fff;}
  .quiz-item .qtext{font-weight:800; margin-bottom:12px; line-height:1.5;}
  .quiz-opts{display:flex; flex-direction:column; gap:8px;}
  .quiz-opt{text-align:left; border:2px solid var(--line); background:#fff; border-radius:10px; padding:11px 14px; cursor:pointer; font-size:0.96rem; font-weight:700;}
  .quiz-opt.correct{border-color:var(--forest); background:#EAF8EA;}
  .quiz-opt.wrong{border-color:var(--berry); background:#FDECEC;}
  .quiz-feedback{margin-top:10px; font-size:0.9rem; line-height:1.55; color:var(--ink-soft);}
  .quiz-item.bonus{border-style:dashed;}
  .bonus-tag{font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--gold-dark); letter-spacing:0.03em; display:block; margin-bottom:6px;}

  .bionik-pair{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; border:2px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; background:#fff; cursor:pointer;}
  @media (max-width:560px){.bionik-pair{grid-template-columns:1fr; text-align:center;}}
  .bionik-pair .side{text-align:center;}
  .bionik-pair .side .cap{font-weight:800; margin-top:6px; display:block; font-size:0.94rem;}
  .bionik-pair .mid{font-family:'Fredoka',sans-serif; font-size:1.3rem; color:var(--gold-dark);}
  .bionik-explain{grid-column:1/-1; border-top:2px dashed var(--line); margin-top:12px; padding-top:12px; font-size:0.94rem; line-height:1.6; display:none;}
  .bionik-pair.open{border-color:var(--gold-dark);}
  .bionik-pair.open .bionik-explain{display:block;}

  .ampel-row{display:flex; gap:14px; margin-top:18px; flex-wrap:wrap;}
  .ampel-btn{flex:1 1 140px; border:2px solid var(--line); border-radius:16px; padding:20px 12px; text-align:center; cursor:pointer; background:#fff; font-weight:800;}
  .ampel-btn .circle{width:36px; height:36px; border-radius:50%; margin:0 auto 10px;}
  .ampel-btn.green .circle{background:#3FB56C;}
  .ampel-btn.yellow .circle{background:var(--gold);}
  .ampel-btn.red .circle{background:var(--berry);}
  .ampel-btn.selected{border-color:var(--ink); transform:scale(1.03);}
  .ampel-feedback{margin-top:18px; padding:14px 16px; border-radius:14px; background:#F3F8F1; font-size:0.96rem; line-height:1.6;}

  .stamp{width:120px; height:120px; border-radius:50%; border:4px solid var(--forest); display:flex; align-items:center; justify-content:center; margin:6px auto 22px; transform:rotate(-8deg); font-family:'Fredoka',sans-serif; font-weight:700; text-align:center; color:var(--forest-dark); font-size:1rem; line-height:1.2; background:#EAF8EA;}

  .small-note{font-size:0.88rem; color:var(--ink-soft); margin-top:10px;}
  .progress-count{font-size:0.9rem; color:var(--ink-soft); font-weight:800;}
  .icon-badge{display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; background:var(--wind-tint); margin-bottom:8px;}
  .section-tier .icon-badge{background:var(--tier-tint);}

  .speak-btn{display:inline-flex; align-items:center; gap:6px; background:#fff; border:2px solid var(--line); border-radius:100px; padding:6px 14px; font-weight:800; font-size:0.82rem; cursor:pointer; margin:4px 0 12px;}
  .speak-btn.playing{border-color:var(--gold-dark); background:#FFF8E4;}
  body.no-tts .speak-btn{display:none;}

  .fav-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
  .fav-btn{font-size:1.9rem; background:#fff; border:2px solid var(--line); border-radius:16px; padding:14px 18px; cursor:pointer;}
  .fav-btn.picked{border-color:var(--gold-dark); background:#FFF8E4; transform:scale(1.06);}
  .fav-feedback{margin-top:12px; font-weight:800; text-align:center; color:var(--forest-dark); min-height:1.4em;}

  .sort-chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0;}
  .sort-chip{background:#fff; border:2px solid var(--line); border-radius:100px; padding:10px 16px; font-weight:700; font-size:0.92rem; cursor:pointer;}
  .sort-chip.selected{border-color:var(--gold-dark); background:#FFF8E4;}
  .sort-chip.correct{border-color:var(--forest); background:#EAF8EA; color:var(--forest-dark); cursor:default;}
  .sort-chip.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .sort-baskets{display:flex; gap:14px; margin-top:10px;}
  .basket{flex:1; text-align:center; border:3px dashed var(--line); border-radius:16px; padding:18px 10px; font-weight:800; cursor:pointer; font-size:1.05rem;}
  .basket.wind{color:var(--wind-dark);}
  .basket.tier{color:var(--tier-dark);}
  .basket.hover{background:var(--gold); border-color:var(--gold-dark); border-style:solid;}
  .sort-progress{text-align:center; font-weight:800; margin-top:14px; color:var(--ink-soft);}
</style>
</head>

const TTS_OK = ('speechSynthesis' in window);
if(!TTS_OK) document.body && document.body.classList.add('no-tts');
let currentUtterTarget = null;
function ttsButton(targetId){
  return `<button class="speak-btn" data-target="${targetId}">🔊 Vorlesen</button>`;
}
function speakTarget(targetId, btn){
  if(!TTS_OK) return;
  const el = document.getElementById(targetId);
  if(!el) return;
  const isPlaying = btn.classList.contains('playing');
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.playing').forEach(b=>b.classList.remove('playing'));
  if(isPlaying) return;
  const utter = new SpeechSynthesisUtterance(el.innerText);
  utter.lang = 'de-DE';
  utter.rate = 0.95;
  utter.onend = ()=> btn.classList.remove('playing');
  btn.classList.add('playing');
  window.speechSynthesis.speak(utter);
}

function sectionClass(id){
  if(id.startsWith('wind')) return 'section-wind';
  if(id.startsWith('tier')) return 'section-tier';
  return '';
}

function renderTopbar(id){
  let pill = '';
  if(id.startsWith('wind')) pill = `<div class="section-pill wind">💨 Windverbreitung</div>`;
  else if(id.startsWith('tier')) pill = `<div class="section-pill tier">🦔 Tierverbreitung</div>`;
  return `
    <div class="topbar">
      <div class="brand">🚕 Taxi gesucht</div>
      ${pill}
    </div>
    <div class="trail">
      ${STEPS.map((s,i)=>{
        const cls = i < state.stepIndex ? 'done' : (i===state.stepIndex ? 'current' : '');
        return `<div class="stop ${cls}"><div class="dot">${cls==='current'?STOP_ICON[s]:''}</div></div>`;
      }).join('')}
    </div>
  `;
}

function nav(prevEnabled, nextEnabled, nextLabel){
  return `
    <div class="actions">
      <button class="btn ghost" id="btn-back" ${prevEnabled?'':'disabled'}>← Zurück</button>
      <button class="btn" id="btn-next" ${nextEnabled?'':'disabled'}>${nextLabel||'Weiter →'}</button>
    </div>
  `;
}

function wrap(id, inner){
  return `${renderTopbar(id)}<div class="card ${sectionClass(id)}">${inner}</div>`;
}

function exImg(ex){
  if(ex.img) return `<img src="${ex.img}" alt="${ex.name}">`;
  if(ex.svg) return SVG[ex.svg];
  return `<div style="font-size:2.4rem;">✨</div>`;
}

function quizBlock(item, storeKey, idx){
  const answered = state[storeKey][idx];
  let html = `<div class="quiz-item ${item.bonus?'bonus':''}">`;
  if(item.bonus) html += `<span class="bonus-tag">Bonus – heute nicht Pflichtstoff</span>`;
  html += `<div class="qtext">${item.q}</div><div class="quiz-opts">`;
  item.opts.forEach((opt,oi)=>{
    let cls='';
    if(answered!==undefined){ if(oi===item.correct) cls='correct'; else if(oi===answered) cls='wrong'; }
    html += `<button class="quiz-opt ${cls}" data-store="${storeKey}" data-idx="${idx}" data-o="${oi}" ${answered!==undefined?'disabled':''}>${opt}</button>`;
  });
  html += `</div>`;
  if(answered!==undefined) html += `<div class="quiz-feedback">${item.fb}</div>`;
  html += `</div>`;
  return html;
}

    <p class="lede" id="${pid}">${data.intro}</p>
    ${ttsButton(pid)}
    <div class="example-grid">
      ${data.examples.map(ex=>`<div class="example"><div class="imgwrap">${exImg(ex)}</div><div class="name">${ex.name}</div><div class="desc">${ex.desc}</div></div>`).join('')}
    </div>
    ${nav(true, true)}
  `);
}

function ablaufStep(id, data){
  const key = id+'_check';
  const answered = state.checksAnswered[key];
  const diagramWind = `
    <div class="diagram">
      <div class="step">${SVG.tree}<div class="cap">Same löst sich</div></div>
      <div class="arrow">→</div>
      <div class="step">${SVG.windarrows}<div class="cap">Wind trägt ihn fort</div></div>
      <div class="arrow">→</div>
      <div class="step">${SVG.sprout}<div class="cap">Keimung (wenn Ort passt)</div></div>
    </div>`;
  const diagramTier = `
    <div class="diagram">
      <div class="step">${SVG.bush}<div class="cap">Frucht wird reif</div></div>
      <div class="arrow">→</div>
      <div class="step">${SVG.fox}<div class="cap">Tier frisst / trägt mit</div></div>
      <div class="arrow">→</div>
      <div class="step">${SVG.sprout}<div class="cap">Same landet anderswo</div></div>
    </div>`;
  const pid = id+'_text';
  return wrap(id, `
    <p class="eyebrow">${data.label} · So läuft's ab</p>
    <h2>Der Ablauf</h2>
    ${data.key==='wind' ? diagramWind : diagramTier}
    <p class="lede" id="${pid}">${data.ablauf}</p>
    ${ttsButton(pid)}
    <hr class="divider">
    <p style="font-weight:800; margin-bottom:10px;">Verstehens-Check:</p>
    ${quizBlock(data.ablaufCheck, 'checksAnswered', key)}
    ${nav(true, answered!==undefined)}
  `);
}

function eigenschaftenStep(id, data){
  const pid = id+'_text';
  return wrap(id, `
    <p class="eyebrow">${data.label} · Eigenschaften</p>
    <h2>Was braucht Same oder Frucht dafür?</h2>
    <div id="${pid}">
      <p class="lede">${data.eigenschaften}</p>
      <div class="explain-box"><ul>${data.eigenschaftenListe.map(l=>`<li>${l}</li>`).join('')}</ul></div>
    </div>
    ${ttsButton(pid)}
    <div class="bonus-box" id="bonus-${id}">
      <button class="bonus-toggle" data-bonus="${id}">🔍 Noch neugierig? Extra-Wissen <span>＋</span></button>
      <div class="bonus-body">${data.bonus}</div>
    </div>
    ${nav(true, true)}
  `);
}

function vornachStep(id, data){
  const pid = id+'_text';
  return wrap(id, `
    <p class="eyebrow">${data.label} · Vor- und Nachteile</p>
    <h2>Kosten und Nutzen abwägen</h2>
    <div class="vor-nach-grid" id="${pid}">
      <div class="vn-box vor"><div class="vn-title">✅ Vorteile</div>${data.vorteile}</div>
      <div class="vn-box nach"><div class="vn-title">⚠️ Nachteile</div>${data.nachteile}</div>
    </div>
    ${ttsButton(pid)}
    <div class="merksatz">💡 Merksatz: ${data.merksatz}</div>
    ${nav(true, true)}
  `);
}

function checkStep(id, data){
  const key = id;
  const answered = state.checksAnswered[key];
  const tableKey = 'write_'+data.key;
  const checked = !!state.writeChecks[tableKey];
  return wrap(id, `
    <p class="eyebrow">${data.label} · Kurzer Check</p>
    <h2>Hast du's verstanden?</h2>
    ${quizBlock(data.check2, 'checksAnswered', key)}
    <div class="write-prompt">
      <div class="head">✍️ Ins Heft:</div>
      <p style="margin:0 0 8px;">Schreib das jetzt in dein Heft – einfach untereinander, so wie hier:</p>
      <div class="stack-list">
        <div class="stack-heading">${data.emoji} ${data.label}</div>
        <div class="stack-row"><span class="stack-label">Ablauf</span>${data.table.ablauf}</div>
        <div class="stack-row"><span class="stack-label">Eigenschaften</span>${data.table.eigen}</div>
        <div class="stack-row"><span class="stack-label">Vorteile</span>${data.table.vor}</div>
        <div class="stack-row"><span class="stack-label">Nachteile</span>${data.table.nach}</div>
      </div>
      <label class="confirm-row"><input type="checkbox" id="chk-${tableKey}" ${checked?'checked':''}> Ich habe das ins Heft geschrieben.</label>
    </div>
    ${nav(true, answered!==undefined && checked)}
  `);
}

function stepGesamt(){
  const checked = !!state.writeChecks.gesamt;
  return wrap('gesamt', `
    <p class="eyebrow">Zusammenführung</p>
    <h2>Deine vollständige Übersicht</h2>
    <p class="lede">Super gemacht – du hast jetzt beide Strategien selbst erarbeitet! In deinem Heft stehen Wind und Tier bereits nacheinander untereinander. Hier zum letzten Abgleich nochmal beide zusammen:</p>
    <div class="stack-list">
      <div class="stack-heading">💨 Windverbreitung</div>
      <div class="stack-row"><span class="stack-label">Ablauf</span>${WIND.table.ablauf}</div>
      <div class="stack-row"><span class="stack-label">Eigenschaften</span>${WIND.table.eigen}</div>
      <div class="stack-row"><span class="stack-label">Vorteile</span>${WIND.table.vor}</div>
      <div class="stack-row"><span class="stack-label">Nachteile</span>${WIND.table.nach}</div>
    </div>
    <div class="stack-list">
      <div class="stack-heading">🦔 Tierverbreitung</div>
      <div class="stack-row"><span class="stack-label">Ablauf</span>${TIER.table.ablauf}</div>
      <div class="stack-row"><span class="stack-label">Eigenschaften</span>${TIER.table.eigen}</div>
      <div class="stack-row"><span class="stack-label">Vorteile</span>${TIER.table.vor}</div>
      <div class="stack-row"><span class="stack-label">Nachteile</span>${TIER.table.nach}</div>
    </div>
    <div class="explain-box" style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <div style="flex:1; min-width:220px;">
        <strong>Zum Merken – ein echtes Zahlenbeispiel:</strong> Eine einzige Birke produziert rund <strong>30.000.000 Samen</strong> pro Baum (Windverbreitung) – ein Apfelbaum dagegen nur etwa <strong>100 Früchte</strong> (Tierverbreitung). Genau das ist die Kosten-Nutzen-Abwägung in echten Zahlen!
      </div>
      <div style="display:flex; gap:10px;">
        <img src="${BIRKENSAMEN_IMG}" alt="" style="width:100px; height:100px; object-fit:cover; border-radius:10px;">
        <img src="${APFEL_IMG}" alt="" style="width:100px; height:100px; object-fit:cover; border-radius:10px;">
      </div>
    </div>
    <div class="write-prompt">
      <div class="head">✍️ Ins Heft:</div>
      <p style="margin:0;">Vergleiche deine Notizen im Heft mit dieser Übersicht. Ergänze, falls dir etwas fehlt.</p>
      <label class="confirm-row"><input type="checkbox" id="chk-gesamt" ${checked?'checked':''}> Meine Notizen im Heft sind vollständig und korrekt.</label>
    </div>
    ${nav(true, checked)}
  `);
}

function stepSortier(){
  const total = SORT_ITEMS.length;
  const doneCount = Object.keys(state.sortDone).length;
  const allDone = doneCount === total;
  return wrap('sortier', `
    <p class="eyebrow">Kurze Übung</p>
    <h2>Wind oder Tier? 🧩</h2>
    <p class="lede">Tippe eine Karte an und dann den richtigen Korb.</p>
    <div class="sort-chips">
      ${SORT_ITEMS.map((it,i)=>{
        if(state.sortDone[i]) return `<div class="sort-chip correct">✓ ${it.text}</div>`;
        const sel = state.sortSelected===i ? 'selected' : '';
        return `<div class="sort-chip ${sel}" data-chip="${i}">${it.text}</div>`;
      }).join('')}
    </div>
    <div class="sort-baskets">
      <div class="basket wind" data-basket="wind">💨 Wind</div>
      <div class="basket tier" data-basket="tier">🦔 Tier</div>
    </div>
    <div class="sort-progress">${doneCount} von ${total} richtig einsortiert</div>
    ${nav(true, allDone)}
  `);
}

function stepBionik(){
  const fav = state.fav;
  const favText = {
    1:'Der Propellerflieger-Trick vom Ahorn – genial, wie ein Same zum Mini-Hubschrauber wird!',
    2:'Der Schirmflieger-Trick der Pusteblume – ein winziger Fallschirm aus der Natur!',
    3:'Die Klette – aus lästigen Fellstacheln wurde eine der nützlichsten Erfindungen überhaupt!'
  };
  return wrap('bionik', `
    <p class="eyebrow">Natur als Vorbild</p>
    <h2>Bionik 🔧</h2>
    <p class="lede">Bionik bedeutet: Die Technik schaut sich Tricks von der Natur ab. Tippe auf ein Paar, um die Verbindung zu sehen.</p>
    <div class="bionik-pair" data-bio="1">
      <div class="side"><div style="font-size:2.2rem;">🚁</div><span class="cap">Hubschrauber-Rotor</span></div>
      <div class="mid">↔</div>
      <div class="side"><div style="font-size:2.2rem;">🍁</div><span class="cap">Ahorn-Propellerflieger</span></div>
      <div class="bionik-explain">Die Ahornfrucht dreht sich beim Fallen wie ein Propeller und wird dadurch abgebremst und weiter vom Wind getragen. Ingenieure haben dieses Prinzip beim Rotorblatt des Hubschraubers übernommen.</div>
    </div>
    <div class="bionik-pair" data-bio="2">
      <div class="side"><img src="${FALLSCHIRM_IMG}" alt="" style="width:100%; max-width:150px; border-radius:10px;"><span class="cap">Fallschirm</span></div>
      <div class="mid">↔</div>
      <div class="side"><div style="font-size:2.2rem;">🌼</div><span class="cap">Pusteblume</span></div>
      <div class="bionik-explain">Die feinen Härchen der Pusteblume bremsen den Fall ab wie ein Schirm, sodass der Same lange in der Luft bleibt und weit fliegen kann – genau wie ein Fallschirm.</div>
    </div>
    <div class="bionik-pair" data-bio="3">
      <div class="side"><div style="font-size:2.2rem;">🔗</div><span class="cap">Klettverschluss</span></div>
      <div class="mid">↔</div>
      <div class="side"><div style="font-size:2.2rem;">🌿</div><span class="cap">Klette / Wilde Möhre</span></div>
      <div class="bionik-explain">Ein Ingenieur untersuchte, warum Klettenfrüchte so hartnäckig im Fell seines Hundes hafteten, und entdeckte die winzigen Widerhaken unter dem Mikroskop. So entstand die Idee für den Klettverschluss mit Häkchen und Schlaufen.</div>
    </div>
    <div class="explain-box" style="text-align:center;">
      <p style="font-weight:800; margin:0 0 4px;">Welches Naturvorbild überrascht dich am meisten? Tipp dein Lieblingspaar an! ⭐</p>
      <div class="fav-row">
        <button class="fav-btn ${fav===1?'picked':''}" data-fav="1">🚁🍁</button>
        <button class="fav-btn ${fav===2?'picked':''}" data-fav="2">🪂🌼</button>
        <button class="fav-btn ${fav===3?'picked':''}" data-fav="3">🔗🌿</button>
      </div>
      <div class="fav-feedback">${fav?favText[fav]:''}</div>
    </div>
    ${nav(true, true)}
  `);
}

function stepTest(){
  let html = `
    <p class="eyebrow">Abschlusstest</p>
    <h2>Teste dein Wissen 📝</h2>
    <p class="lede">Kein benoteter Test, sondern ein ehrlicher Selbstcheck vor der nächsten Stunde.</p>
  `;
  QUIZ.forEach((item, qi)=>{ html += quizBlock(item, 'quizAnswered', qi); });
  const answeredCount = Object.keys(state.quizAnswered).length;
  html += `<p class="progress-count">${answeredCount} von ${QUIZ.length} beantwortet</p>`;
  html += nav(true, answeredCount===QUIZ.length);
  return wrap('test', html);
}

function stepAmpel(){
  const sel = state.ampel;
  const feedback = {
    green: "Klasse! Du kannst dein Wissen jetzt sicher anwenden.",
    yellow: "Schau dir vor der nächsten Stunde nochmal deine Notizen im Heft an – vielleicht hilft auch ein Mitschüler bei den Punkten, die noch wackeln.",
    red: "Kein Problem – sprich das kurz bei deiner Lehrkraft an, damit ihr gezielt nachschauen könnt, wo es hakt."
  };
  return wrap('ampel', `
    <p class="eyebrow">Selbsteinschätzung</p>
    <h2>Wie sicher fühlst du dich? 🚦</h2>
    <div class="ampel-row">
      <div class="ampel-btn green ${sel==='green'?'selected':''}" data-ampel="green"><div class="circle"></div>Verstanden</div>
      <div class="ampel-btn yellow ${sel==='yellow'?'selected':''}" data-ampel="yellow"><div class="circle"></div>Teilweise</div>
      <div class="ampel-btn red ${sel==='red'?'selected':''}" data-ampel="red"><div class="circle"></div>Noch unsicher</div>
    </div>
    ${sel?`<div class="ampel-feedback">${feedback[sel]}</div>`:''}
    ${nav(true, !!sel)}
  `);
}

function stepEnde(){
  return wrap('ende', `
    <div class="stamp">Reise<br>geschafft 🎉</div>
    <h2 style="text-align:center;">Danke fürs Mitreisen!</h2>
    <p class="lede" style="text-align:center;">Du weißt jetzt, wie Wind und Tiere als Taxi für Samen dienen und welche Kosten und Vorteile jede Strategie hat.</p>
    <p class="small-note" style="text-align:center;">Bitte kontrolliere zum Schluss, ob deine Notizen im Heft vollständig sind (Wind und Tier, je mit Ablauf, Eigenschaften, Vor- und Nachteilen).</p>
    <div class="actions" style="justify-content:center; gap:16px;">
      <button class="btn ghost" id="btn-back">← Zurück</button>
      <button class="btn" id="btn-vertiefung" style="background:var(--gold-dark); box-shadow:0 3px 0 #A87800;">🚀 Noch Zeit? Profi-Wissen entdecken</button>
    </div>
  `);
}

function stepVertiefung(){
  let html = `
    <p class="eyebrow">Differenzierung · Für Schnelle & Neugierige</p>
    <h2>Profi-Wissen 🚀</h2>
    <p class="lede">Du bist fertig und hast noch Zeit? Wind und Tiere sind nicht die einzigen Taxis der Natur – hier kommen vier weitere spannende Strategien.</p>
  `;
  VERTIEFUNG.forEach((v, vi)=>{
    const pid = 'vert_'+vi;
    const answered = state.vertAnswered ? state.vertAnswered[vi] : undefined;
    html += `
      <div class="explain-box">
        <h3 style="display:flex; align-items:center; gap:10px; font-size:1.15rem;"><span style="font-size:1.6rem;">${v.icon}</span> ${v.title}</h3>
        ${v.img ? `<img src="${v.img}" alt="" style="max-width:100%; max-height:220px; border-radius:12px; margin:10px 0; display:block;">` : ''}
        <p id="${pid}" style="margin-top:8px;">${v.text}</p>
        ${ttsButton(pid)}
        <hr class="divider" style="margin:16px 0;">
        ${quizBlock(v.check, 'vertAnswered', vi)}
      </div>
    `;
  });
  html += `<div class="actions" style="justify-content:center;"><button class="btn ghost" id="btn-back-ende">← Zurück zum Ziel</button></div>`;
  return wrap('vertiefung', html);
}

const RENDERERS = {
  start: stepStart, anker: stepAnker,
  wind_intro: ()=>introStep('wind_intro', WIND),
  wind_ablauf: ()=>ablaufStep('wind_ablauf', WIND),
  wind_eigenschaften: ()=>eigenschaftenStep('wind_eigenschaften', WIND),
  wind_vornach: ()=>vornachStep('wind_vornach', WIND),
  wind_check: ()=>checkStep('wind_check', WIND),
  tier_intro: ()=>introStep('tier_intro', TIER),
  tier_ablauf: ()=>ablaufStep('tier_ablauf', TIER),
  tier_eigenschaften: ()=>eigenschaftenStep('tier_eigenschaften', TIER),
  tier_vornach: ()=>vornachStep('tier_vornach', TIER),
  tier_check: ()=>checkStep('tier_check', TIER),
  gesamt: stepGesamt, sortier: stepSortier, bionik: stepBionik, test: stepTest, ampel: stepAmpel, ende: stepEnde, vertiefung: stepVertiefung
};

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render(){
  const id = STEPS[state.stepIndex];
  app.innerHTML = RENDERERS[id]();
  bindEvents(id);
  window.scrollTo(0,0);
  const cur = document.querySelector('.trail .stop.current');
  if(cur) cur.scrollIntoView({inline:'center', block:'nearest'});
}

function bindEvents(id){
  const backBtn = document.getElementById('btn-back');
  const nextBtn = document.getElementById('btn-next');
  if(backBtn) backBtn.addEventListener('click', ()=>{ if(state.stepIndex>0){ state.stepIndex--; render(); }});
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(state.stepIndex<STEPS.length-1){ state.stepIndex++; render(); }});

  document.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const store = btn.dataset.store, idx = btn.dataset.idx, oi = parseInt(btn.dataset.o);
      if(state[store][idx]!==undefined) return;
      state[store][idx] = oi;
      render();
    });
  });

  document.querySelectorAll('[data-bonus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('bonus-'+btn.dataset.bonus).classList.toggle('open');
    });
  });

  document.querySelectorAll('.bionik-pair').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });

  if(id==='ampel'){
    document.querySelectorAll('.ampel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.ampel = btn.dataset.ampel; render(); });
    });
  }

  document.querySelectorAll('.speak-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> speakTarget(btn.dataset.target, btn));
  });

  const vertBtn = document.getElementById('btn-vertiefung');
  if(vertBtn) vertBtn.addEventListener('click', ()=>{ state.stepIndex = STEPS.indexOf('vertiefung'); render(); });
  const backEndeBtn = document.getElementById('btn-back-ende');
  if(backEndeBtn) backEndeBtn.addEventListener('click', ()=>{ state.stepIndex = STEPS.indexOf('ende'); render(); });

  if(id==='bionik'){
    document.querySelectorAll('.fav-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{ e.stopPropagation(); state.fav = parseInt(btn.dataset.fav); render(); });
    });
  }

  if(id==='sortier'){
    document.querySelectorAll('.sort-chip[data-chip]').forEach(chip=>{
      chip.addEventListener('click', ()=>{ state.sortSelected = parseInt(chip.dataset.chip); render(); });
    });
    document.querySelectorAll('.basket').forEach(basket=>{
      basket.addEventListener('click', ()=>{
        if(state.sortSelected===null || state.sortSelected===undefined) return;
        const idx = state.sortSelected;
        const item = SORT_ITEMS[idx];
        if(item.ans === basket.dataset.basket){
          state.sortDone[idx] = true;
          state.sortSelected = null;
          render();
        } else {
          basket.classList.add('hover');
          const chipEl = document.querySelector(`.sort-chip[data-chip="${idx}"]`);
          if(chipEl) chipEl.classList.add('shake');
          setTimeout(()=>{ basket.classList.remove('hover'); if(chipEl) chipEl.classList.remove('shake'); }, 350);
        }
      });
    });
  }

  // generic write-checkbox binder
  document.querySelectorAll('.confirm-row input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.id.replace('chk-','');
      state.writeChecks[key] = cb.checked;
      render();
    });
  });
}

render();
</script>
</body>
</html>
