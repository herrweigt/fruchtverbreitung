<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz mit Feedback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .question-block {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .feedback {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: bold;
      display: none;
    }
    .feedback.correct {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    .feedback.incorrect {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Wissens-Quiz</h2>

  <form id="quizForm">
    <!-- Frage 1 -->
    <div class="question-block" data-correct="b" data-hint="Hinweis: Fotosynthese findet hauptsächlich in den Blättern statt.">
      <p><strong>1. Wo findet bei Pflanzen die Fotosynthese primär statt?</strong></p>
      <label><input type="radio" name="q1" value="a"> Wurzeln</label><br>
      <label><input type="radio" name="q1" value="b"> Blätter</label><br>
      <label><input type="radio" name="q1" value="c"> Blüten</label>
      <div class="feedback"></div>
    </div>

    <!-- Frage 2 -->
    <div class="question-block" data-correct="a" data-hint="Hinweis: Überlege, welches Gas für die ZAtmung aufgenommen wird.">
      <p><strong>2. Welches Gas nehmen Pflanzen für die Fotosynthese auf?</strong></p>
      <label><input type="radio" name="q2" value="a"> Kohlendioxid</label><br>
      <label><input type="radio" name="q2" value="b"> Sauerstoff</label><br>
      <label><input type="radio" name="q2" value="c"> Stickstoff</label>
      <div class="feedback"></div>
    </div>

    <button type="submit">Antworten prüfen</button>
  </form>

  <script>
    document.getElementById('quizForm').addEventListener('submit', function(event) {
      // Verhindert das Neuladen der Seite und das Hochspringen nach oben
      event.preventDefault();

      const questions = document.querySelectorAll('.question-block');

      questions.forEach((block) => {
        const selectedOption = block.querySelector('input[type="radio"]:checked');
        const correctAnswer = block.dataset.correct;
        const hint = block.dataset.hint || 'Leider falsch. Versuche es nochmal!';
        const feedbackEl = block.querySelector('.feedback');

        // Reset Feedback-Klassen
        feedbackEl.className = 'feedback';

        if (!selectedOption) {
          feedbackEl.textContent = 'Bitte wähle eine Antwort aus.';
          feedbackEl.classList.add('incorrect');
        } else if (selectedOption.value === correctAnswer) {
          feedbackEl.textContent = 'Richtig!';
          feedbackEl.classList.add('correct');
        } else {
          feedbackEl.textContent = `Falsch. ${hint}`;
          feedbackEl.classList.add('incorrect');
        }
      });
    });
  </script>

</body>
</html>
